---
name: cron-tasks

on:
  schedule:
    - cron: "30 3 * * 0"

  workflow_dispatch:

env:
  PYTHON_VERSION: "3.14.x"
  UV_VERSION: "0.12.3"

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  stale-workflow-runs:
    runs-on: ubuntu-latest

    permissions:
      actions: write
      contents: read

    steps:
      - name: Run delete-workflow-runs # https://github.com/tagdots/delete-workflow-runs
        id: delete-workflow-runs
        uses: tagdots/delete-workflow-runs@f2c8c90686b3cca383d91ff02dd97e4b7f052529 # 1.2.34
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          repo-url: ${{ github.server_url }}/${{ github.repository }}
          max-days: 10
          dry-run: false

      - name: Get data and set GITHUB_OUTPUT
        id: get_data
        shell: bash
        run: |
          cat data_dict.log | jq .

  stale-issues-prs:
    runs-on: ubuntu-latest

    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Run stale # https://github.com/actions/stale
        id: stale-issues-prs
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          stale-issue-message: "This issue is stale because it has been open 5 days with no activity. Remove stale label or comment or this will be closed in 3 days after stale"
          days-before-stale: 5
          days-before-close: 3
          delete-branch: true

  stale-branches:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Run delete-branches # https://github.com/tagdots/delete-branches
        id: delete-branches
        uses: tagdots/delete-branches@7ab458c4f92b1dcd058cce7ebd57bb88ec6d21ab # 1.2.16
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          repo-url: ${{ github.server_url }}/${{ github.repository }}
          max-idle-days: 10
          exclude-branches: "badges"
          dry-run: false

  update-pre-commit:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Run update-pre-commit # https://github.com/tagdots/update-pre-commit-action
        id: update-pre-commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: tagdots/update-pre-commit-action@a80688d12cf761973e340674bcf552af366afba5 # 1.0.28
        with:
          file: .pre-commit-config.yaml
          dry-run: false
          open-pr: true

  notify-slack:
    if: always()
    needs:
      [
        stale-workflow-runs,
        stale-issues-prs,
        stale-branches,
        update-pre-commit,
      ]
    runs-on: ubuntu-latest

    outputs:
      WORKFLOW_RESULT: ${{ steps.get-overall-jobs-results.outputs.WORKFLOW_RESULT }}

    steps:
      - name: Get overall jobs results
        id: get-overall-jobs-results
        shell: bash
        run: |
          if ${{
            needs.stale-workflow-runs.result == 'success'
            && needs.stale-issues-prs.result == 'success'
            && needs.stale-branches.result == 'success'
            && needs.update-pre-commit.result == 'success' }}; then
            echo "WORKFLOW_RESULT=:white_check_mark:" >> "$GITHUB_OUTPUT"
          else
            echo "WORKFLOW_RESULT=:no_entry:" >> "$GITHUB_OUTPUT"
          fi

      - name: Post message to Slack # https://github.com/slackapi/slack-github-action
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: "${{ secrets.SECRET_SLACK_APP_GITHUB_BOT }}"
          payload: |
            channel: "${{ secrets.SECRET_SLACK_CHANNEL_CRON_TASKS }}"
            text: "
              *Repository: ${{ github.repository }}*\n
              *Workflow : ${{ github.workflow }} ${{ steps.get-overall-jobs-results.outputs.WORKFLOW_RESULT }}*
              ```
              URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\n
              Job: stale-workflow-runs - ${{ needs.stale-workflow-runs.result }}\n
              Job: stale-issues-prs    - ${{ needs.stale-issues-prs.result }}\n
              Job: stale-branches      - ${{ needs.stale-branches.result }}\n
              Job: update-pre-commit   - ${{ needs.update-pre-commit.result }}
              ```"
